<text x="660" y="336" font-family="'Press Start 2P'" font-size="12" fill="#d4564a" text-anchor="middle" letter-spacing="1">AND THE TRADE-OFF, SINCE THERE IS ONE</text>
<text x="660" y="360" font-family="'Press Start 2P'" font-size="8" fill="#a29ec4" text-anchor="middle" letter-spacing="0">65 silhouettes carry 963 icons, so two things sharing a shape are told apart by colour alone</text>
<text x="660" y="377" font-family="'Press Start 2P'" font-size="8" fill="#a29ec4" text-anchor="middle" letter-spacing="0">so the test suite enforces a minimum colour distance between any two elements drawn from the same silhouette</text>
<text x="660" y="394" font-family="'Press Start 2P'" font-size="8" fill="#a29ec4" text-anchor="middle" letter-spacing="0">and the shape is chosen from what the element IS — vessels are vessels, blades are blades — rather than from whatever was free</text>
</svg>