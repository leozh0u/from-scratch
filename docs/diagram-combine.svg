<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="627" viewBox="0 0 1440 627" shape-rendering="crispEdges">
<rect width="1440" height="627" fill="#191536"/>
<text x="720" y="60" font-family="'Press Start 2P'" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">PRESSING COMBINE</text>
<text x="720" y="98" font-family="'Press Start 2P'" font-size="10" fill="#e8752c" text-anchor="middle" letter-spacing="1">534,061 possible pairs.  1,036 of them do something.</text>
<text x="720" y="132" font-family="'Press Start 2P'" font-size="8" fill="#a29ec4" text-anchor="middle" letter-spacing="0">so the failing case is not an edge case, it is the game — and it has to be free</text>
<polygon points="72,200 68,204 64,208 60,212 440,212 436,208 432,204 428,200 440,362 436,366 432,370 428,374 72,374 68,370 64,366 60,362" fill="#100d20"/>
